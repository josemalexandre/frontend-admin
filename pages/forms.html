<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Flask</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <button class="sidebar__close" type="button" aria-label="Fechar menu">
                <i class="bi bi-x-lg" aria-hidden="true"></i>
            </button>
            <div class="sidebar__brand">Template Flask</div>
            <nav class="sidebar__nav">
                <div class="sidebar__section">
                    <div class="sidebar__section-title">Principal</div>
                    <a class="sidebar__link" href="dashboard.html">
                        <i class="bi bi-speedometer2" aria-hidden="true"></i>
                        <span>Dashboard</span>
                    </a>
                    <a class="sidebar__link" href="#">
                        <i class="bi bi-buildings" aria-hidden="true"></i>
                        <span>Empresas</span>
                    </a>
                    <a class="sidebar__link" href="#">
                        <i class="bi bi-file-earmark-text" aria-hidden="true"></i>
                        <span>Licenças</span>
                    </a>
                    <a class="sidebar__link" href="#">
                        <i class="bi bi-bar-chart" aria-hidden="true"></i>
                        <span>Relatórios</span>
                    </a>
                </div>
            </nav>
            <div class="sidebar__footer">
                <a class="sidebar__link" href="#">
                    <i class="bi bi-gear" aria-hidden="true"></i>
                    <span>Configurações</span>
                </a>
            </div>
        </aside>
        <div class="app__content">
            <div class="sidebar-overlay"></div>
            <header class="navbar">
                <button class="navbar__menu" type="button" aria-label="Abrir menu">
                    <i class="bi bi-list" aria-hidden="true"></i>
                </button>
                <div class="navbar__title">
                    Formulários
                </div>
                <div class="navbar__actions">
                    <span>Usuário</span>
                </div>
            </header>
            <main>
                <div class="page-container">
                    <nav class="breadcrumb" aria-label="Breadcrumb">
                        <a href="../index.html">Início</a>
                        <span aria-hidden="true">/</span>
                        <span aria-current="page">Formulários</span>
                    </nav>
                    <header class="page-header">
                        <div class="page-header__info">
                            <h1 class="page-header__title">Formulários</h1>
                        </div>
                        <div class="page-header__actions"></div>
                    </header>
                    <section class="page-content">
                        <form action="" class="form">
                            <div class="form__group">
                                <label for="razao_social">Razão Social</label>
                                <input type="text" name="razao_social" id="razao_social" required>
                            </div>
                            <div class="form__group">
                                <label for="cnpj">CNPJ</label>
                                <input type="text" name="cnpj" id="cnpj" required minlength="14" maxlength="14">
                            </div>
                            <div class="form__group">
                                <label for="situacao">Situação</label>
                                <select name="situacao" id="situacao">
                                    <option value="ativa">Ativa</option>
                                    <option value="inativa">Inativa</option>
                                    <option value="suspensa">Suspensa</option>
                                </select>
                            </div>
                            <div class="form__group">
                                <input type="checkbox" name="ativo" id="ativo" value="sim">
                                <label for="ativo">Empresa ativa</label>
                            </div>
                            <div class="form__group">
                                <fieldset>
                                    <legend>Tipos de Empresa</legend>
                                    <div class="form__radio">
                                        <input type="radio" name="tipo_empresa" id="pj" value="pj">
                                        <label for="pj">Pessoa Jurídica</label>
                                    </div>
                                    <div class="form__radio">
                                        <input type="radio" name="tipo_empresa" id="pf" value="pf">
                                        <label for="pf">Pessoa Física</label>
                                    </div>
                                    <div class="form__radio">
                                        <input type="radio" name="tipo_empresa" id="outro" value="outro">
                                        <label for="outro">Outros</label>
                                    </div>
                                </fieldset>
                            </div>
                            <div class="form__group">
                                <label for="documento">Documento</label>
                                <input type="file" name="documento" id="documento" accept=".pdf">
                            </div>
                            <div class="form__actions">
                                <button type="submit">Salvar</button>
                            </div>
                        </form>
                    </section>
                </div>
            </main>
        </div>
    </div>
    <script src="../assets/js/main.js"></script>
</body>

</html>
